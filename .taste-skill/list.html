<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目 · Rill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <div class="frame">
      <!-- L-frame: sidebar + top bar share one tinted ground, no rule between -->
      <aside class="sidebar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path
              d="M2 5c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 4 2"
              stroke="#1b6c80"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M2 9c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 4 2"
              stroke="#1b6c80"
              stroke-width="1.5"
              stroke-linecap="round"
              opacity=".55"
            />
            <path
              d="M2 13c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 4 2"
              stroke="#1b6c80"
              stroke-width="1.5"
              stroke-linecap="round"
              opacity=".3"
            />
          </svg>
          <span class="word">Rill<small>小说创作</small></span>
        </div>
        <div class="group-label">创作</div>
        <a class="nav-item" aria-current="page" href="list.html">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2.5 3.5h11v9h-11z" />
            <path d="M5 6.5h6M5 9h4" />
          </svg>
          项目<span class="count">3</span>
        </a>
        <a class="nav-item" href="new.html">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <path d="M8 3.5v9M3.5 8h9" />
          </svg>
          新建项目
        </a>
        <div class="bottom">
          <a class="nav-item" href="#">
            <svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle cx="8" cy="8" r="5.5" />
              <path d="M6.6 6.4a1.5 1.5 0 1 1 2.3 1.3c-.5.3-.9.7-.9 1.3" />
              <circle cx="8" cy="11.4" r=".4" fill="currentColor" />
            </svg>
            帮助
          </a>
          <a class="nav-item" href="#">
            <svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle cx="8" cy="8" r="2.2" />
              <path d="M8 2.5v1.6M8 11.9v1.6M2.5 8h1.6M11.9 8h1.6" />
            </svg>
            设置
          </a>
        </div>
      </aside>

      <header class="topbar">
        <button class="icon-btn menu-toggle" aria-label="打开菜单">
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" />
          </svg>
        </button>
        <div class="search">
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <circle cx="6.2" cy="6.2" r="4.2" />
            <path d="m9.6 9.6 2.4 2.4" />
          </svg>
          搜索项目<kbd>⌘K</kbd>
        </div>
        <div class="right">
          <span class="stamp">本地模式</span>
          <span class="who">偃</span>
        </div>
      </header>

      <!-- the sheet: white, inset 8px from the right and bottom edges -->
      <main class="sheet hug">
        <div class="sheet-body">
          <div class="title-row">
            <div>
              <h1>项目</h1>
              <div class="sub">3 个创作项目，按最近更新排序</div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px">
              <span class="stamp">更新于 今天 14:47</span>
              <a class="btn primary" href="new.html">新建项目</a>
            </div>
          </div>

          <div class="kpis" style="margin-bottom: 24px">
            <div class="kpi">
              <div class="kpi-label">项目</div>
              <div class="kpi-value">3</div>
            </div>
            <div class="kpi">
              <div class="kpi-label">待确认</div>
              <div class="kpi-value">1</div>
            </div>
            <div class="kpi">
              <div class="kpi-label">生成中</div>
              <div class="kpi-value">1</div>
            </div>
            <div class="kpi">
              <div class="kpi-label">失败</div>
              <div class="kpi-value">1</div>
            </div>
          </div>

          <div class="grid" style="margin-top: 8px">
            <div class="panel" style="grid-column: span 7">
              <header>
                <h2>全部项目</h2>
                <span class="meta">3 个</span>
              </header>
              <div class="rows" id="rows"></div>
            </div>
            <div class="panel" style="grid-column: span 5">
              <header>
                <h2>最近动态</h2>
                <span class="meta">今天</span>
              </header>
              <div class="rows" id="feed"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="data.js"></script>
    <script>
      const pill = { 待确认: 'warn', 生成中: '', 失败: 'neg' };
      document.getElementById('rows').innerHTML = RILL.projects
        .map(
          (p) => `
    <a class="row proj" href="workspace.html" style="color:inherit">
      <span class="t">${p.title}<span class="sub">${p.genre} · ${p.length} · ${p.tone} · ${p.mode === 'manual' ? '手动推进' : '自动推进'}</span></span>
      <span class="stage-cell">
        <span style="font-size:var(--fs-body)">${p.stage}</span>
        <span class="bar"><i style="width:${(p.done / p.total) * 100}%"></i></span>
        <span class="num" style="font-size:var(--fs-small);color:var(--faint)">${p.done}/${p.total}</span>
      </span>
      <span class="pill ${pill[p.status]}">${p.status}</span>
      <span class="when">${p.updated}</span>
      <svg class="go" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>
    </a>`,
        )
        .join('');
      document
        .querySelector('.menu-toggle')
        ?.addEventListener('click', () =>
          document.querySelector('.sidebar').classList.toggle('open'),
        );

      const feed = [
        {
          t: '14:31',
          what: '生成 人物 · 8 位',
          who: '青川令',
          note: '2,905 in / 4,512 out',
          state: 'warn',
          mark: '待确认',
        },
        {
          t: '14:02',
          what: '生成 世界观',
          who: '青川令',
          note: '2,317 in / 3,884 out',
          state: '',
          mark: '已完成',
        },
        {
          t: '13:58',
          what: '生成 种子',
          who: '青川令',
          note: '1,842 in / 1,206 out',
          state: '',
          mark: '已完成',
        },
        {
          t: '昨天 21:07',
          what: '人物 生成失败',
          who: '她的海',
          note: '输出不符合结构定义，未写入',
          state: 'neg',
          mark: '失败',
        },
      ];
      document.getElementById('feed').innerHTML = feed
        .map(
          (f) => `
    <div class="row" style="align-items: flex-start">
      <span style="font-family: var(--mono); font-size: var(--fs-small); color: var(--faint); width: 76px; flex: none; padding-top: 2px">${f.t}</span>
      <span style="min-width: 0; flex: 1">
        <span style="font-weight: 500">${f.who} · ${f.what}</span>
        <span class="sub clip">${f.note}</span>
      </span>
      <span class="pill ${f.state}" style="margin-left: auto">${f.mark}</span>
    </div>`,
        )
        .join('');
    </script>
  </body>
</html>
