<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新建项目 · Rill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <div class="frame">
      <aside class="sidebar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path
              d="M2 5c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 4 2"
              stroke="#1b6c80"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path
              d="M2 9c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 4 2"
              stroke="#1b6c80"
              stroke-width="1.5"
              stroke-linecap="round"
              opacity=".55"
            />
            <path
              d="M2 13c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 4 2"
              stroke="#1b6c80"
              stroke-width="1.5"
              stroke-linecap="round"
              opacity=".3"
            />
          </svg>
          <span class="word">Rill<small>小说创作</small></span>
        </div>
        <div class="group-label">创作</div>
        <a class="nav-item" href="list.html">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M2.5 3.5h11v9h-11z" />
            <path d="M5 6.5h6M5 9h4" />
          </svg>
          项目<span class="count">3</span>
        </a>
        <a class="nav-item" aria-current="page" href="new.html">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <path d="M8 3.5v9M3.5 8h9" />
          </svg>
          新建项目
        </a>
        <div class="bottom">
          <a class="nav-item" href="#"
            ><svg
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            >
              <circle cx="8" cy="8" r="5.5" />
              <path d="M6.6 6.4a1.5 1.5 0 1 1 2.3 1.3c-.5.3-.9.7-.9 1.3" />
              <circle cx="8" cy="11.4" r=".4" fill="currentColor" /></svg
            >帮助</a
          >
        </div>
      </aside>

      <header class="topbar">
        <button class="icon-btn menu-toggle" aria-label="打开菜单">
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" />
          </svg>
        </button>
        <div class="search">
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          >
            <circle cx="6.2" cy="6.2" r="4.2" />
            <path d="m9.6 9.6 2.4 2.4" />
          </svg>
          搜索项目<kbd>⌘K</kbd>
        </div>
        <div class="right">
          <span class="stamp">本地模式</span>
          <span class="who">偃</span>
        </div>
      </header>

      <main class="sheet">
        <div class="sheet-body">
          <div class="wizard">
            <div class="crumbs"><a href="list.html">项目</a> / 新建项目</div>
            <div class="title-row">
              <div>
                <h1>创作意图</h1>
                <div class="sub">
                  已选类型：<b style="color: var(--text); font-weight: 500">玄幻</b>（<a
                    href="#"
                    style="text-decoration: underline; text-underline-offset: 3px"
                    >返回更改</a
                  >）· 类型相关问题已随选择出现
                </div>
              </div>
            </div>

            <div class="steps">
              <b>1 类型</b><span>›</span><b>2 创作意图</b><span>›</span><span>3 生成种子</span>
            </div>

            <div class="form-grid">
              <div class="field full">
                <label for="t">项目标题</label>
                <input class="input" id="t" value="青川令" placeholder="给你的小说起个名字" />
              </div>
              <div class="field">
                <label>篇幅</label>
                <div class="choices" data-name="length">
                  <button class="choice">短篇</button>
                  <button class="choice" aria-pressed="true">中篇</button>
                  <button class="choice">长篇</button>
                </div>
                <div class="hint">中篇建议 40 章 · 每章约 2,500 字</div>
              </div>
              <div class="field">
                <label>基调</label>
                <div class="choices" data-name="tone">
                  <button class="choice">轻松</button><button class="choice">热血</button
                  ><button class="choice">治愈</button> <button class="choice">暗黑</button
                  ><button class="choice">紧张</button
                  ><button class="choice" aria-pressed="true">厚重</button>
                </div>
              </div>
              <div class="field">
                <label>叙事视角</label>
                <div class="choices" data-name="pov">
                  <button class="choice">第一人称</button>
                  <button class="choice" aria-pressed="true">第三人称限知</button>
                  <button class="choice">第三人称全知</button>
                </div>
              </div>
              <div class="field">
                <label>人物规模</label>
                <div class="choices" data-name="characterScale">
                  <button class="choice">精简</button>
                  <button class="choice" aria-pressed="true">标准</button>
                  <button class="choice">丰满</button>
                </div>
                <div class="hint">中篇默认 8 位人物，主角保底</div>
              </div>
              <div class="field">
                <label>金手指类型</label>
                <div class="choices" data-name="goldenFinger">
                  <button class="choice">系统</button><button class="choice">重生</button>
                  <button class="choice" aria-pressed="true">天赋</button
                  ><button class="choice">无</button>
                </div>
              </div>
              <div class="field">
                <label>力量体系</label>
                <div class="choices" data-name="powerSystem">
                  <button class="choice" aria-pressed="true">修炼等级</button
                  ><button class="choice">血脉</button> <button class="choice">符文</button
                  ><button class="choice">其他</button>
                </div>
              </div>
              <div class="field full">
                <label for="idea">创作想法（选答）</label>
                <textarea
                  class="input"
                  id="idea"
                  rows="3"
                  style="height: auto; padding: 10px 12px; line-height: 1.5"
                >
想写一个关于「记忆作为燃料」的故事：越修复过去，越忘记为什么开始。</textarea>
              </div>
            </div>

            <div class="wizard-foot">
              <span class="hint" style="color: var(--muted); font-size: var(--fs-small)"
                >创建后将立即生成种子；生成期间可在工作台查看进度。</span
              >
              <span style="flex: 1"></span>
              <button class="btn ghost" style="color: var(--muted)">返回上一步</button>
              <button class="btn primary">创建项目，生成种子</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      document.querySelectorAll('.choices').forEach((group) => {
        group.querySelectorAll('.choice').forEach((b) =>
          b.addEventListener('click', () => {
            group
              .querySelectorAll('.choice')
              .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          }),
        );
      });
      document
        .querySelector('.menu-toggle')
        ?.addEventListener('click', () =>
          document.querySelector('.sidebar').classList.toggle('open'),
        );
    </script>
  </body>
</html>
